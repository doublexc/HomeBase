<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeVault 🏠</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f0eb; --surface: #fffdf9; --surface2: #f0ece5; --border: #e2d9ce;
      --text: #2c2420; --text-secondary: #7a6a60; --accent: #c0622f; --accent-light: #f5e6de;
      --accent-dark: #9e4f25; --green: #3a7d44; --green-light: #e3f0e5; --red: #c0392b;
      --red-light: #fdecea; --shadow: 0 2px 12px rgba(44,36,32,0.08);
      --shadow-lg: 0 8px 32px rgba(44,36,32,0.14); --radius: 14px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }
    .page { display: none; min-height: 100vh; }
    .page.active { display: block; }
    .login-bg { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at 20% 20%, #f7e6d8 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, #e8ddd4 0%, transparent 60%), var(--bg); }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); animation: fadeUp 0.4s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .logo-wrap { text-align: center; margin-bottom: 32px; }
    .logo-icon { font-size: 40px; display: block; margin-bottom: 8px; }
    .logo-text { font-family: 'Kanit', sans-serif; font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    .logo-sub { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-family: 'Sarabun', sans-serif; font-size: 15px; color: var(--text); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    .btn-primary { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-family: 'Kanit', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-secondary { width: 100%; padding: 12px; background: transparent; color: var(--accent); border: 1.5px solid var(--accent); border-radius: var(--radius-sm); font-family: 'Kanit', sans-serif; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: none; font-family: 'Sarabun', sans-serif; font-size: 14px; cursor: pointer; padding: 8px; margin-top: 8px; width: 100%; }
    .btn-danger { width: 100%; padding: 11px; background: transparent; color: var(--red); border: 1.5px solid var(--red); border-radius: var(--radius-sm); font-size: 14px; cursor: pointer; margin-top: 12px; }
    .error-msg { background: var(--red-light); color: var(--red); border: 1px solid #f5c6c2; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
    .hidden { display: none !important; }
    .app-header { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 58px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 8px rgba(44,36,32,0.06); }
    .header-title { font-family: 'Kanit', sans-serif; font-size: 17px; font-weight: 600; }
    .main-content { max-width: 680px; margin: 0 auto; padding: 24px 20px 60px; }
    .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .member-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 16px; text-align: center; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow); }
    .member-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-size: 22px; font-weight: 700; color: var(--accent); margin: 0 auto 12px; }
    .profile-top { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
    .avatar-big { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-size: 26px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 10px; }
    .item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .item-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .badge-public { background: var(--green-light); color: var(--green); }
    .badge-private { background: var(--accent-light); color: var(--accent); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(44,36,32,0.45); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
    .modal-card { background: var(--surface); border-radius: 20px 20px 0 0; padding: 28px 24px 36px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--border); border-radius: 24px; cursor: pointer; transition: 0.2s; }
    .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
    input:checked + .slider { background: var(--green); }
    input:checked + .slider::before { transform: translateX(20px); }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; border-radius: 30px; padding: 10px 22px; font-size: 14px; z-index: 999; }
  </style>
</head>
<body>
<div id="app">
  <div id="page-login" class="page active">
    <div class="login-bg"><div class="login-card">
      <div class="logo-wrap"><span class="logo-icon">🏠</span><div class="logo-text">HomeVault</div></div>
      <div class="form-group"><label>Username</label><input type="text" id="login-username" placeholder="ชื่อผู้ใช้"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="รหัสผ่าน"></div>
      <div id="login-error" class="error-msg hidden"></div>
      <button class="btn-primary" id="btn-login">เข้าสู่ระบบ</button>
      <button class="btn-secondary" id="btn-goto-register">สมัครด้วยโค้ดเชิญ</button>
    </div></div>
  </div>
  <div id="page-register" class="page">
    <div class="login-bg"><div class="login-card">
      <div class="logo-wrap"><span class="logo-icon">🔑</span><div class="logo-text">สมัครสมาชิก</div></div>
      <div class="form-group"><label>โค้ดเชิญ</label><input type="text" id="reg-invite" placeholder="กรอกโค้ดเชิญ"></div>
      <div class="form-group"><label>Username</label><input type="text" id="reg-username" placeholder="ชื่อผู้ใช้"></div>
      <div class="form-group"><label>ชื่อที่แสดง</label><input type="text" id="reg-displayname" placeholder="ชื่อเล่น"></div>
      <div class="form-group"><label>Password</label><input type="password" id="reg-password" placeholder="ตั้งรหัสผ่าน"></div>
      <div id="reg-error" class="error-msg hidden"></div>
      <button class="btn-primary" id="btn-register">สมัครสมาชิก</button>
      <button class="btn-ghost" id="btn-goto-login">← กลับไป Login</button>
    </div></div>
  </div>
  <div id="page-home" class="page">
    <header class="app-header"><div class="header-title">🏠 HomeVault</div><div id="header-username"></div><button class="btn-logout" id="btn-logout">ออก</button></header>
    <main class="main-content"><div class="section-title">สมาชิกในบ้าน</div><div class="members-grid" id="members-grid"></div></main>
  </div>
  <div id="page-profile" class="page">
    <header class="app-header"><button id="btn-back">←</button><div id="profile-header-name"></div><button id="btn-logout2">ออก</button></header>
    <main class="main-content">
      <div class="profile-top"><div class="avatar-big" id="profile-avatar"></div><div class="profile-info"><div id="profile-display-name"></div><div id="profile-username-text"></div></div><button class="btn-add hidden" id="btn-add-item">+ เพิ่ม</button></div>
      <div class="items-list" id="items-list"></div>
    </main>
  </div>
  <div id="modal-item" class="modal-overlay hidden"><div class="modal-card">
    <div class="modal-title" id="modal-title">เพิ่มรายการ</div>
    <div class="form-group"><label>ชื่อรายการ *</label><input type="text" id="item-name"></div>
    <div class="form-group"><label>Username</label><input type="text" id="item-username"></div>
    <div class="form-group"><label>Password</label><input type="text" id="item-password"></div>
    <div class="form-group"><label>หมายเหตุ</label><textarea id="item-note"></textarea></div>
    <div class="form-group"><div class="toggle-row"><span id="visibility-label">🔒 Private</span><label class="switch"><input type="checkbox" id="item-public"><span class="slider"></span></label></div></div>
    <div class="modal-actions"><button id="btn-cancel-item">ยกเลิก</button><button class="btn-primary" id="btn-save-item">บันทึก</button></div>
    <button class="btn-danger hidden" id="btn-delete-item">🗑 ลบ</button>
  </div></div>
  <div id="toast" class="toast hidden"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, addDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  // --- เพิ่ม Import สำหรับ Auth ---
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBnbXPyLcqCnRdsK3zvkKXbvXRSfHOwZdU",
    authDomain: "homebase-ddfd3.firebaseapp.com",
    projectId: "homebase-ddfd3",
    storageBucket: "homebase-ddfd3.firebasestorage.app",
    messagingSenderId: "565115475465",
    appId: "1:565115475465:web:6c6b2be92c4ac3ffb0cad8",
    measurementId: "G-FQZ4H2KV95"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app); // สร้างตัวแปร auth

  let currentUser = null; 
  let viewingUid = null; 
  let editingItemId = null;

  async function simpleHash(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join(''); }
  function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
  function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 2500); }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // --- ฟังก์ชันหลักที่แก้ใหม่ ---
  async function init() {
    // 1. ตรวจสอบสถานะการ Login ตลอดเวลา
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // ถ้าเคย Login มาก่อนแล้ว ให้พยายามดึงโปรไฟล์จาก sessionStorage 
        // หรือจะดึงจาก Firestore ก็ได้ แต่ใช้ sessionStorage ต่อเพื่อความเร็ว
        const savedUser = sessionStorage.getItem('hv_user');
        if (savedUser) {
          currentUser = JSON.parse(savedUser);
          document.getElementById('header-username').textContent = currentUser.displayName;
          showPage('page-home');
          loadMembers();
        } else {
          showPage('page-login');
        }
      } else {
        // ถ้ายังไม่เคย Login เลย ให้แอบ Login แบบ Anonymous ทันที (คนแก่ไม่รู้ตัว)
        try {
          await signInAnonymously(auth);
          showPage('page-login');
        } catch (e) {
          console.error("Auth Error:", e);
        }
      }
    });

    // 2. ปุ่ม Login (เหมือนเดิม แต่เราได้ request.auth ไปใช้ใน Rules แล้ว)
    document.getElementById('btn-login').onclick = async () => {
      const u = document.getElementById('login-username').value.trim(); 
      const p = document.getElementById('login-password').value;
      try {
        const snap = await getDoc(doc(db, 'users', u.toLowerCase())); 
        if(!snap.exists()) throw new Error('ไม่พบผู้ใช้');
        if(snap.data().passwordHash !== await simpleHash(p)) throw new Error('รหัสผิด');
        
        currentUser = { uid: u.toLowerCase(), displayName: snap.data().displayName }; 
        sessionStorage.setItem('hv_user', JSON.stringify(currentUser));
        
        // หลังจาก Login สำเร็จ ให้ Refresh เพื่อเข้าหน้า Home
        location.reload();
      } catch(e) { 
        document.getElementById('login-error').textContent = e.message; 
        document.getElementById('login-error').classList.remove('hidden'); 
      }
    };

    // ปุ่มอื่นๆ คงเดิม...
    document.getElementById('btn-register').onclick = async () => {
      const inv = document.getElementById('reg-invite').value.trim().toUpperCase(); 
      const u = document.getElementById('reg-username').value.trim().toLowerCase();
      const d = document.getElementById('reg-displayname').value.trim(); 
      const p = document.getElementById('reg-password').value;
      try {
        const iSnap = await getDoc(doc(db, 'settings', 'inviteCodes')); 
        if(!iSnap.exists() || !iSnap.data()[inv]) throw new Error('โค้ดเชิญผิด');
        
        await setDoc(doc(db, 'users', u), { 
          displayName: d, 
          passwordHash: await simpleHash(p), 
          createdAt: Date.now(),
          authUid: auth.currentUser.uid // เก็บ UID ไว้ใช้เช็คสิทธิ์ใน Rules
        });
        showToast('สมัครสำเร็จ!'); 
        showPage('page-login');
      } catch(e) { 
        document.getElementById('reg-error').textContent = e.message; 
        document.getElementById('reg-error').classList.remove('hidden'); 
      }
    };

    document.getElementById('btn-logout').onclick = document.getElementById('btn-logout2').onclick = () => { 
      sessionStorage.removeItem('hv_user'); 
      location.reload(); 
    };
    
    document.getElementById('btn-back').onclick = () => { showPage('page-home'); loadMembers(); };
    document.getElementById('btn-goto-register').onclick = () => showPage('page-register');
    document.getElementById('btn-goto-login').onclick = () => showPage('page-login');
    document.getElementById('btn-add-item').onclick = () => { 
      editingItemId = null; 
      document.getElementById('modal-title').textContent = 'เพิ่มรายการ'; 
      document.getElementById('modal-item').classList.remove('hidden'); 
    };
    document.getElementById('btn-cancel-item').onclick = () => document.getElementById('modal-item').classList.add('hidden');

    document.getElementById('btn-save-item').onclick = async () => {
      const payload = { 
        name: document.getElementById('item-name').value, 
        username: document.getElementById('item-username').value, 
        password: document.getElementById('item-password').value, 
        note: document.getElementById('item-note').value, 
        public: document.getElementById('item-public').checked 
      };
      const col = collection(db, 'users', currentUser.uid, 'items');
      if(editingItemId) {
        await updateDoc(doc(col, editingItemId), payload); 
      } else { 
        payload.createdAt = Date.now(); 
        await addDoc(col, payload); 
      }
      document.getElementById('modal-item').classList.add('hidden'); 
      loadItems(currentUser.uid, true);
    };
  }

  // loadMembers และ loadItems เหมือนเดิม...
  async function loadMembers() {
    const grid = document.getElementById('members-grid'); grid.innerHTML = 'โหลด...';
    const snap = await getDocs(collection(db, 'users')); grid.innerHTML = '';
    snap.forEach(d => {
      const card = document.createElement('div'); card.className = 'member-card';
      card.innerHTML = `<div class="member-avatar">${d.data().displayName[0]}</div><div>${d.data().displayName}</div>`;
      card.onclick = () => openProfile(d.id, d.data().displayName); grid.appendChild(card);
    });
  }

  async function openProfile(uid, name) {
    viewingUid = uid; const isOwner = currentUser.uid === uid;
    document.getElementById('profile-header-name').textContent = name; document.getElementById('profile-display-name').textContent = name;
    document.getElementById('profile-avatar').textContent = name[0];
    if(isOwner) document.getElementById('btn-add-item').classList.remove('hidden'); else document.getElementById('btn-add-item').classList.add('hidden');
    showPage('page-profile'); loadItems(uid, isOwner);
  }

  async function loadItems(uid, isOwner) {
    const list = document.getElementById('items-list'); list.innerHTML = 'โหลด...';
    let q = query(collection(db, 'users', uid, 'items'), orderBy('createdAt', 'desc'));
    if(!isOwner) q = query(collection(db, 'users', uid, 'items'), where('public', '==', true));
    const snap = await getDocs(q); list.innerHTML = '';
    snap.forEach(d => {
      const item = d.data(); const card = document.createElement('div'); card.className = 'item-card';
      card.innerHTML = `<div class="item-header"><b>${esc(item.name)}</b> <span class="item-badge ${item.public?'badge-public':'badge-private'}">${item.public?'🌐':'🔒'}</span></div><div>User: ${esc(item.username)}</div><div>Pass: ${esc(item.password)}</div>`;
      list.appendChild(card);
    });
  }

  init();
</script>

</body>
</html>
